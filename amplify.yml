version: 1
backend:
  phases:
    build:
      commands:
        - which pnpm || npm install -g pnpm
        - pnpm install --prefer-offline
        - NODE_OPTIONS=--max-old-space-size=6144 npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "Deploying pre-built dist folder (see SETUP.md)"
        - ls dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
